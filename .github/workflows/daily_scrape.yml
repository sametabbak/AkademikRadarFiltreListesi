name: Daily Academic Announcements Scraper

# ilan.gov.tr's /api/ routes return 403 to GitHub-hosted runners, while a
# Turkish home connection is accepted. So this runs on a self-hosted runner
# on Samet's PC. The scraper collects every ad it has not seen before, so a
# run that is delayed or skipped loses nothing - the next run picks it all up.

on:
  schedule:
    - cron: '15 21 * * *'   # 00:15 TR
    - cron: '17 4 * * *'    # 07:17 TR  - main run, after Resmi Gazete
    - cron: '10 16 * * *'   # 19:10 TR
  workflow_dispatch:

permissions:
  contents: write           # lets checkout's token push; no PAT needed

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pick a real Python; skip the Microsoft Store alias and bundled copies.
      - name: Locate Python
        shell: powershell
        run: |
          $found = $null
          foreach ($reg in @("HKLM:\SOFTWARE\Python\PythonCore","HKCU:\SOFTWARE\Python\PythonCore")) {
            if (Test-Path $reg) {
              foreach ($ver in (Get-ChildItem $reg | Sort-Object Name -Descending)) {
                $ip = (Get-ItemProperty "$($ver.PSPath)\InstallPath" -ErrorAction SilentlyContinue).'(default)'
                if ($ip) {
                  $c = Join-Path $ip "python.exe"
                  if ((Test-Path $c) -and ($c -notlike "*WindowsApps*") -and ($c -notlike "*GIMP*")) { $found = $c; break }
                }
              }
            }
            if ($found) { break }
          }
          if (-not $found) {
            $found = (& where.exe python 2>$null) |
                     Where-Object { $_ -notlike "*WindowsApps*" -and $_ -notlike "*GIMP*" } |
                     Select-Object -First 1
          }
          if (-not $found) {
            Write-Host "::error::Python bulunamadi. Python'u 'Install for all users' ile kurun veya runner servisini kendi kullanici hesabinizla calistirin."
            exit 1
          }
          Write-Host "Python: $found"
          & "$found" --version
          # Windows PowerShell 5.1: '>>' writes UTF-16, which the runner cannot
          # read, so the variable would silently never be set. Use UTF-8.
          "PYTHON_EXE=$found" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: powershell
        run: |
          & "$env:PYTHON_EXE" -m pip install --upgrade pip --quiet --disable-pip-version-check
          & "$env:PYTHON_EXE" -m pip install -r scraper/requirements.txt --quiet --disable-pip-version-check

      - name: Run scraper
        shell: powershell
        env:
          PANEL_MODE: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $log = Join-Path $env:TEMP "scrape.log"
          # Redirect through cmd, not PowerShell: in PowerShell 5.1, '2>&1' turns
          # every stderr line (all of Python's logging) into an error record and
          # aborts the step on the first log line.
          cmd /c "`"$env:PYTHON_EXE`" scraper\scrape.py > `"$log`" 2>&1"
          $code = $LASTEXITCODE
          Get-Content $log -Encoding UTF8
          if ($code -ne 0) {
            Write-Host "::error::Scraper exit code $code"
            exit $code
          }

      - name: Summarise outcome
        if: always()
        shell: powershell
        run: |
          $log = Join-Path $env:TEMP "scrape.log"
          "### Scraper sonucu" | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
          if (Test-Path $log) {
            '```'                                     | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Get-Content $log -Tail 12 -Encoding UTF8  | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
            '```'                                     | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
            $txt = Get-Content $log -Raw -Encoding UTF8
            if     ($txt -match "No new ads")   { "Yeni ilan yok - commit atlandi (hata degil)."   | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8 }
            elseif ($txt -match "pending.json") { "Yeni ilanlar pending.json dosyasina yazildi."   | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8 }
            elseif ($txt -match "403")          { "HATA: ilan.gov.tr 403 dondu."                   | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8 }
          } else {
            "**Log bos** - scraper hic calismamis olabilir." | Out-File -Append $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }

      - name: Commit and push data files
        shell: powershell
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ilanlar.json pending.json rejected.json

          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }
          $ts = [System.DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          git commit -m "chore: scrape update [$ts]"
          for ($i = 1; $i -le 3; $i++) {
            git pull --rebase --autostash
            git push
            if ($LASTEXITCODE -eq 0) { Write-Host "Push succeeded."; exit 0 }
            Write-Host "Push attempt $i failed, retrying in 5s..."
            Start-Sleep -Seconds 5
          }
          Write-Host "::error::Push failed after 3 attempts."
          exit 1
