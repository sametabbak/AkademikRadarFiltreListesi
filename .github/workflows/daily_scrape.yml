name: Daily Academic Announcements Scraper

on:
  schedule:
    # GitHub's free-tier scheduler silently DROPS runs when the runner pool is
    # busy - no failure, no notification. With a single daily cron, one dropped
    # slot means a missed day. Three spread-out attempts make that unlikely.
    # When nothing is new a run exits in ~15s and commits nothing, so the extra
    # attempts cost almost nothing against the 2000 free minutes/month.
    # Offset minutes are deliberate: on-the-hour slots are dropped first.
    - cron: '15 22 * * *'    # 00:15 TR - main run, just after Resmi Gazete
    - cron: '17 4 * * *'    # 07:17 TR - catches a dropped morning slot
    - cron: '10 16 * * *'   # 19:10 TR - late safety net
  workflow_dispatch:

# Lets the built-in GITHUB_TOKEN push, so PUSH_TOKEN becomes optional.
permissions:
  contents: write

# If one run is still going when the next fires, queue it instead of letting
# both push to the same files.
concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        # pipefail is essential: GitHub runs `run:` with `bash -e` but WITHOUT
        # pipefail, so `python ... | tee` would report tee's exit code (always 0)
        # and a crashing scraper would show up as a green run with no commit.
        shell: bash
        env:
          PANEL_MODE: "1"          # new ads -> pending.json for panel review
        run: |
          set -o pipefail
          python scraper/scrape.py 2>&1 | tee /tmp/scrape.log

      # Makes a "nothing new" run visibly different from a real failure
      # on the Actions summary page, instead of both looking like silence.
      - name: Summarise outcome
        if: always()
        shell: bash
        run: |
          echo "### Scraper sonucu" >> $GITHUB_STEP_SUMMARY
          if [ ! -s /tmp/scrape.log ]; then
            echo "**Log bos** - scraper hic calismamis olabilir." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 12 /tmp/scrape.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if   grep -q "No new ads"       /tmp/scrape.log; then
            echo "OK: Yeni ilan yok - commit atlandi (hata degil)." >> $GITHUB_STEP_SUMMARY
          elif grep -q "pending.json"     /tmp/scrape.log; then
            echo "OK: Yeni ilanlar pending.json dosyasina yazildi." >> $GITHUB_STEP_SUMMARY
          elif grep -qiE "Traceback|Error|Exception" /tmp/scrape.log; then
            echo "HATA: Scraper hata verdi - log'a bakin." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Listeleme istegi sayisi: $(grep -c 'Listing page' /tmp/scrape.log || echo 0)" >> $GITHUB_STEP_SUMMARY

      - name: Commit and push data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # In PANEL_MODE the scraper writes pending.json, so all three
          # data files must be staged - staging only ilanlar.json silently
          # discarded every scrape.
          git add ilanlar.json pending.json rejected.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: scrape update [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && echo "Push succeeded." && break
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
          fi
