name: Daily Academic Announcements Scraper

on:
  schedule:
    # 07:00 Turkey time = 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

# Lets the built-in GITHUB_TOKEN push, so PUSH_TOKEN becomes optional.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          PANEL_MODE: "1"          # new ads -> pending.json for panel review
        run: python scraper/scrape.py

      - name: Commit and push data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # In PANEL_MODE the scraper writes pending.json, so all three
          # data files must be staged - staging only ilanlar.json silently
          # discarded every scrape.
          git add ilanlar.json pending.json rejected.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: scrape update [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && echo "Push succeeded." && break
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
          fi
