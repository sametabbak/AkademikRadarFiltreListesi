name: Daily Academic Announcements Scraper

on:
  schedule:
    # 07:00 Turkey time = 04:00 UTC
    # Offset from the hour: on-the-hour slots are the most congested and
    # are the ones GitHub drops first when the runner pool is saturated.
    - cron: '17 4 * * *'
  workflow_dispatch:

# Lets the built-in GITHUB_TOKEN push, so PUSH_TOKEN becomes optional.
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        env:
          PANEL_MODE: "1"          # new ads -> pending.json for panel review
        run: python scraper/scrape.py 2>&1 | tee /tmp/scrape.log

      # Makes a "nothing new" run visibly different from a real failure
      # on the Actions summary page, instead of both looking like silence.
      - name: Summarise outcome
        if: always()
        run: |
          echo "### Scraper sonucu" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 4 /tmp/scrape.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "log yok" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if grep -q "No new ads" /tmp/scrape.log 2>/dev/null; then
            echo "Yeni ilan bulunamadi - commit atlandi. Bu bir hata degil." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # In PANEL_MODE the scraper writes pending.json, so all three
          # data files must be staged - staging only ilanlar.json silently
          # discarded every scrape.
          git add ilanlar.json pending.json rejected.json

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: scrape update [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && echo "Push succeeded." && break
              echo "Push attempt $i failed, retrying in 5s..."
              sleep 5
            done
          fi
