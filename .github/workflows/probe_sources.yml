name: Probe data sources

# One-off diagnostic: which Turkish sources will a GitHub-hosted runner reach?
# ilan.gov.tr returns 403 to this runner; this checks whether that is specific
# to ilan.gov.tr or applies to the alternatives too, so the decision about
# where to run the scraper is based on evidence rather than assumption.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, ssl
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          BROWSER = {
            "User-Agent": ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                           "(KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"),
            "Accept": "text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8",
            "Accept-Language": "tr-TR,tr;q=0.9,en;q=0.8",
          }

          targets = [
            ("ilan.gov.tr  listing API (POST)",
             "https://www.ilan.gov.tr/api/api/services/app/Ad/AdsByFilter",
             json.dumps({"keys":{"txv":[73]},"skipCount":0,"maxResultCount":1}).encode()),
            ("ilan.gov.tr  detail API (GET)",
             "https://www.ilan.gov.tr/api/api/services/app/AdDetail/GetAdDetail?id=2094289", None),
            ("ilan.gov.tr  category page (GET)",
             "https://www.ilan.gov.tr/ilan/kategori/73/akademik-personel-alimlari", None),
            ("resmigazete.gov.tr  home",
             "https://www.resmigazete.gov.tr/", None),
            ("resmigazete.gov.tr  ilan index .htm",
             "https://www.resmigazete.gov.tr/ilanlar/eskiilanlar/2022/12/20221231-4.htm", None),
            ("resmigazete.gov.tr  ilan PDF",
             "https://www.resmigazete.gov.tr/ilanlar/eskiilanlar/2022/07/20220727-4-19.pdf", None),
            ("raw.githubusercontent (control)",
             "https://raw.githubusercontent.com/sametabbak/AkademikRadarFiltreListesi/refs/heads/main/pending.json", None),
          ]

          print(f"{'source':<40}{'status':<10}{'bytes':>10}")
          print("-" * 62)
          for label, url, body in targets:
              hdrs = dict(BROWSER)
              if body:
                  hdrs["Content-Type"] = "application/json-patch+json"
                  hdrs["Origin"] = "https://www.ilan.gov.tr"
                  hdrs["Referer"] = "https://www.ilan.gov.tr/ilan/kategori/73/akademik-personel-alimlari"
              req = urllib.request.Request(url, data=body, headers=hdrs,
                                           method="POST" if body else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=25, context=ctx) as r:
                      data = r.read()
                      print(f"{label:<40}{r.status:<10}{len(data):>10,}")
              except urllib.error.HTTPError as e:
                  print(f"{label:<40}{e.code:<10}{'-':>10}   {e.reason}")
              except Exception as e:
                  print(f"{label:<40}{'ERR':<10}{'-':>10}   {type(e).__name__}: {e}")
          PY
