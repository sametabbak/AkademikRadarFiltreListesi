name: Probe data sources

# Round 5. The browser's request (Copy as cURL) carries a custom header,
# X-Request-Origin: IGT-UI, which no earlier probe sent. This runs on GitHub's
# own servers: if it succeeds here, no self-hosted runner is needed at all.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install requests
        run: pip install requests --quiet

      - name: Test the IGT-UI header
        shell: bash
        run: |
          python3 - <<'PY'
          import requests, urllib3
          urllib3.disable_warnings()
          LIST = "https://www.ilan.gov.tr/api/api/services/app/Ad/AdsByFilter"
          DET  = "https://www.ilan.gov.tr/api/api/services/app/AdDetail/GetAdDetail?id=2094289"
          BODY = {"keys": {"txv": [73]}, "skipCount": 0, "maxResultCount": 12}

          FULL = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:156.0) Gecko/20100101 Firefox/156.0",
            "Accept": "text/plain",
            "Accept-Language": "tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7",
            "Content-Type": "application/json-patch+json",
            "Pragma": "no-cache", "Cache-Control": "no-cache",
            "Expires": "Sat, 01 Jan 2000 00:00:00 GMT",
            "X-Requested-With": "XMLHttpRequest",
            "X-Request-Origin": "IGT-UI",
            "Origin": "https://www.ilan.gov.tr",
            "Referer": "https://www.ilan.gov.tr/ilan/kategori/73/akademik-personel-alimlari",
            "Sec-Fetch-Dest": "empty", "Sec-Fetch-Mode": "cors", "Sec-Fetch-Site": "same-origin",
          }
          MINIMAL = {"Content-Type": "application/json-patch+json", "X-Request-Origin": "IGT-UI"}
          WITHOUT = {k: v for k, v in FULL.items() if k != "X-Request-Origin"}

          def run(label, headers):
              try:
                  r = requests.post(LIST, json=BODY, headers=headers, timeout=25, verify=False)
                  extra = ""
                  if r.status_code == 200:
                      res = r.json().get("result", {})
                      extra = f"  numFound={res.get('numFound')}  ads={len(res.get('ads', []))}"
                  print(f"  {label:<44} POST -> {r.status_code}{extra}")
                  return r.status_code == 200
              except Exception as e:
                  print(f"  {label:<44} error: {type(e).__name__}: {e}")
                  return False

          print("Which header is the gate?\n")
          full_ok = run("full browser headers", FULL)
          run("full headers WITHOUT X-Request-Origin", WITHOUT)
          run("only Content-Type + X-Request-Origin", MINIMAL)

          if full_ok:
              d = requests.get(DET, headers=FULL, timeout=25, verify=False)
              n = len(((d.json().get("result") or {}).get("content") or "")) if d.status_code == 200 else 0
              print(f"\n  detail GET with full headers -> {d.status_code}  content {n:,} chars")
              print("\n  >>> GitHub-hosted runners CAN use the API. No PC needed.")
          else:
              print("\n  >>> Still blocked from GitHub's servers - keep the self-hosted runner.")
          PY
