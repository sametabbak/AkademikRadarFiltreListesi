name: Validate data files

# Runs on every push that touches a data file, whoever made it — the scraper,
# the panel, the GitHub web editor, or an AI assistant. A malformed file breaks
# the mobile app for every user, so it must be caught immediately.
on:
  push:
    paths:
      - 'ilanlar.json'
      - 'pending.json'
      - 'rejected.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check JSON syntax and structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json, sys

          failed = False
          for path in ("ilanlar.json", "pending.json", "rejected.json"):
              try:
                  with open(path, encoding="utf-8") as f:
                      text = f.read()
              except FileNotFoundError:
                  print(f"::error file={path}::file is missing")
                  failed = True
                  continue

              if not text.strip():
                  print(f"::error file={path}::file is empty")
                  failed = True
                  continue

              try:
                  data = json.loads(text)
              except json.JSONDecodeError as e:
                  line = text.split("\n")[e.lineno - 1]
                  snippet = line[max(0, e.colno - 40): e.colno + 40]
                  print(f"::error file={path},line={e.lineno},col={e.colno}::"
                        f"invalid JSON: {e.msg}")
                  print(f"    near: ...{snippet}...")
                  print("    Tip: a double quote inside text must be written as \\\"")
                  failed = True
                  continue

              if not isinstance(data.get("ads"), list):
                  print(f"::error file={path}::top-level 'ads' list is missing")
                  failed = True
                  continue

              ids = [a.get("ilanNo") for a in data["ads"]]
              dupes = sorted({i for i in ids if i and ids.count(i) > 1})
              if dupes:
                  # A duplicate key is an error, not a warning: app code commonly
                  # builds a dictionary or keyed table from ilanNo, which throws on
                  # a repeated key and blanks the entire list for every user.
                  level = "error" if path == "ilanlar.json" else "warning"
                  print(f"::{level} file={path}::duplicate ilanNo: {', '.join(dupes)}")
                  if level == "error":
                      failed = True

              # Dates must be null or ISO-8601. An empty string is valid JSON
              # but a C# DateTime? cannot deserialise it, so the app fails to load.
              from datetime import datetime
              bad_dates = []
              for a in data["ads"]:
                  for f in ("publishDate", "deadline"):
                      v = a.get(f)
                      if v is None:
                          continue
                      try:
                          datetime.fromisoformat(str(v).replace("Z", "+00:00"))
                      except ValueError:
                          bad_dates.append(f"{a.get('ilanNo')}.{f}={v!r}")
              if bad_dates:
                  level = "error" if path == "ilanlar.json" else "warning"
                  print(f"::{level} file={path}::invalid date (use null, not \"\"): "
                        + ", ".join(bad_dates))
                  if level == "error":
                      failed = True

              print(f"OK  {path}: {len(data['ads'])} ads")

          sys.exit(1 if failed else 0)
          PY
